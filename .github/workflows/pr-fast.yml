name: PR fast

on:
  pull_request:
    branches:
      - main
      - 'release/*'
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: pr-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout test merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q compadre_assistant document_chunker tests scripts

      - name: Check tracked files and migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_pr_fast.py --base-sha "$BASE_SHA"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Fixed unit subset
        run: |
          python -m unittest discover -s tests -p 'test_config.py'
          python -m unittest discover -s tests -p 'test_capability_composition.py'
          python -m unittest discover -s tests -p 'test_migration_runner.py'

      - name: Validate Compose with synthetic environment
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
