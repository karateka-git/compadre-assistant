name: Main full

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: main-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: main-full-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run-full: ${{ steps.decide.outputs.run-full }}
      previous-release-sha: ${{ steps.decide.outputs.previous-release-sha }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide full run
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.full_ci_controller main

  full-suite:
    name: main-full
    needs: controller
    if: needs.controller.outputs.run-full == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/full-suite.yml
    with:
      previous-release-sha: ${{ needs.controller.outputs.previous-release-sha }}
