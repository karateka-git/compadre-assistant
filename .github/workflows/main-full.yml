name: Main full

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: main-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: main-full-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run-full: ${{ steps.decide.outputs.run-full }}
      previous-release-sha: ${{ steps.decide.outputs.previous-release-sha }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide full run
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPATIBILITY_POLICY_SHA: ${{ vars.COMPATIBILITY_POLICY_SHA }}
        run: python -m scripts.full_ci_controller main

  full-suite:
    name: main-full
    needs: controller
    if: needs.controller.outputs.run-full == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/full-suite.yml
    with:
      previous-release-sha: ${{ needs.controller.outputs.previous-release-sha }}

  ci-metrics:
    name: ci-metrics
    needs: [controller, full-suite]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout metrics collector
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Collect CI metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_WORKFLOW: main-full.yml
          CI_HEAD_SHA: ${{ github.sha }}
        run: python -m scripts.ci_metrics --output ci-metrics
      - name: Preserve collection failure
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p ci-metrics
          if [ ! -f ci-metrics/ci-metrics.md ]; then
            printf '%s\n' '## CI metrics' '' 'Сбор метрик не завершён: проверьте checkout, Python и шаг сбора. Допуск релиза не меняется.' > ci-metrics/ci-metrics.md
            printf '%s\n' '{"error":"collector did not produce a report"}' > ci-metrics/ci-metrics-error.json
            cat ci-metrics/ci-metrics.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload CI metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-metrics/
          if-no-files-found: error
          retention-days: 90
