name: check-full-suite

on:
  workflow_call:
    inputs:
      previous-release-sha:
        description: Full commit SHA of the previous published release (bootstrap production SHA before v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  repository-compatibility:
    name: check-full-repository-compatibility-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Validate external policy pin
        env:
          POLICY_SHA: ${{ vars.COMPATIBILITY_POLICY_SHA }}
        run: '[[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout trusted compatibility policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ vars.COMPATIBILITY_POLICY_SHA }}
          path: policy
          persist-credentials: false
      - name: Checkout compatibility candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Setup compatibility Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Check exact repository compatibility pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPATIBILITY_POLICY_SHA: ${{ vars.COMPATIBILITY_POLICY_SHA }}
          PREVIOUS_SHA: ${{ inputs.previous-release-sha }}
        run: python -B policy/scripts/ci_repository_compatibility.py --repository "$GITHUB_WORKSPACE/candidate" --previous-sha "$PREVIOUS_SHA" --output "$RUNNER_TEMP/repository-compatibility"
      - name: Upload repository compatibility evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-compatibility/
          if-no-files-found: error
          retention-days: 90

  full-suite:
    name: check-full-suite
    needs: repository-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require repository compatibility evidence
        env:
          RESULT: ${{ needs.repository-compatibility.result }}
          DIGEST: ${{ needs.repository-compatibility.outputs.artifact-digest }}
        run: 'test "$RESULT" = success && [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]'

      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m scripts.ci_watch dependencies -- python -m pip install -r requirements.txt

      - name: Run full unittest suite
        id: unit
        run: python -m scripts.ci_watch unit -- python -m unittest discover -s tests

      - name: Run three autonomous smoke checks
        id: smokes
        run: |
          python -m scripts.ci_watch smoke -- python -m compadre_assistant --sqlite-smoke
          python -m scripts.ci_watch smoke -- python -m compadre_assistant --pipeline-smoke
          python -m scripts.ci_watch smoke -- python -m compadre_assistant --analysis-smoke

      - name: Check fresh and previous SQLite schemas
        id: migrations
        env:
          PREVIOUS_SHA: ${{ inputs.previous-release-sha }}
        run: python -m scripts.ci_watch migrations -- python -m scripts.check_full_migrations --previous-sha "$PREVIOUS_SHA"

      - name: Build and healthcheck candidate image
        id: candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python -m scripts.ci_watch candidate -- python -m scripts.check_candidate --expected-sha "$EXPECTED_SHA"

      - name: Publish check manifest
        if: always()
        env:
          PREVIOUS_SHA: ${{ inputs.previous-release-sha }}
          COMPATIBILITY_ARTIFACT_DIGEST: ${{ needs.repository-compatibility.outputs.artifact-digest }}
          CHECK_COMPATIBILITY: ${{ needs.repository-compatibility.result }}
          CHECK_CHECKOUT: ${{ steps.checkout.outcome }}
          CHECK_UNIT: ${{ steps.unit.outcome }}
          CHECK_SMOKES: ${{ steps.smokes.outcome }}
          CHECK_MIGRATIONS: ${{ steps.migrations.outcome }}
          CHECK_CANDIDATE: ${{ steps.candidate.outcome }}
        run: python -m scripts.write_full_manifest
