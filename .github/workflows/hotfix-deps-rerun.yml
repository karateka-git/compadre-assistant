name: Hotfix dependency rerun

on:
  pull_request_target:
    branches:
      - main
    types: [closed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: hotfix-deps-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # После первого merge base.sha указывает на прежний commit без нового скрипта.
      # merge_commit_sha — точный уже слитый commit защищённой целевой ветки.
      - name: Checkout merged target commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Rerun current hotfix-deps job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.rerun_hotfix_deps
