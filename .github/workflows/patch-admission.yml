name: Sign PATCH admission

on:
  workflow_run:
    workflows: [release-check-full]
    types: [completed]
    branches: ['release/**']

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  sign:
    if: >-
      vars.PATCH_ADMISSION_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: patch-admission-signing
      deployment: false
    steps:
      - name: Checkout trusted signer
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Issue admission for exact completed CI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPATIBILITY_POLICY_SHA: ${{ vars.COMPATIBILITY_POLICY_SHA }}
          SIGNING_KEY: ${{ secrets.PATCH_ADMISSION_SIGNING_KEY }}
        run: |
          set -eu
          umask 077
          key="$(mktemp "$RUNNER_TEMP/admission-key.XXXXXXXX")"
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          python -m scripts.issue_patch_admission --key "$key" --output "$RUNNER_TEMP/patch-admission.json"
      - name: Upload signed admission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/patch-admission.json
          if-no-files-found: error
          retention-days: 90
