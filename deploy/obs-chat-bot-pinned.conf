[Unit]
# Постоянный marker блокирует автозапуск в незавершённой критической секции.
ConditionPathExists=!/var/lib/compadre-assistant-deploy/deploy-in-progress

[Service]
# Устанавливается только контроллером вместе с проверенным локальным image tag.
EnvironmentFile=/var/lib/compadre-assistant-deploy/runtime.env
ExecStart=
# Только команды Compose работают с root UID: внешний pin остаётся root:root 0700/0600.
ExecStart=!/usr/bin/docker compose up -d --no-build --pull never vk_assistant tg_assistant
ExecStop=
ExecStop=!/usr/bin/docker compose stop vk_assistant tg_assistant
