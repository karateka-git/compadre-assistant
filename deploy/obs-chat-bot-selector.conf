[Unit]
# Docker не перезапускает v2 writers самостоятельно; boot проходит durable guard.
ConditionPathExists=!/var/lib/compadre-assistant-deploy/deploy-in-progress
PartOf=docker.service

[Service]
EnvironmentFile=/var/lib/compadre-assistant-deploy/runtime.env
ExecStart=
ExecStart=!/usr/bin/env -i HOME=/root PATH=/usr/bin:/bin PYTHONPATH=/usr/local/lib/compadre-assistant-deploy /usr/bin/python3 -B -m scripts.deploy_runtime start
ExecStop=
ExecStop=!/usr/bin/env -i HOME=/root PATH=/usr/bin:/bin PYTHONPATH=/usr/local/lib/compadre-assistant-deploy /usr/bin/python3 -B -m scripts.deploy_runtime stop
