x-assistant-base: &assistant-base
  build:
    context: .
  image: ${ASSISTANT_IMAGE:-compadre-assistant:dev}
  pull_policy: never
  env_file:
    - .env
  environment:
    APP_DEBUG: ${APP_DEBUG:-false}
    ENABLED_CHANNELS: ${ENABLED_CHANNELS-telegram,vk}
  volumes:
    - ./data:/app/data

services:
  tg_assistant:
    <<: *assistant-base
    restart: unless-stopped
    command: ["python", "-m", "compadre_assistant", "--telegram-bot"]
    healthcheck:
      test: ["CMD", "python", "-m", "compadre_assistant", "--healthcheck", "--channels", "telegram"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  vk_assistant:
    <<: *assistant-base
    restart: unless-stopped
    command: ["python", "-m", "compadre_assistant", "--vk-bot"]
    healthcheck:
      test: ["CMD", "python", "-m", "compadre_assistant", "--healthcheck", "--channels", "vk"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
